  <defs>
    <radialGradient id="space-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#0c1a10"/>
      <stop offset="55%" stop-color="#070a08"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="comet-trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c8ffd9" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <style>
    .star { fill: #ffffff; }
    .star-g { fill: #00FF41; }
    @keyframes twinkle-a { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes twinkle-b { 0%,100% { opacity: .9; } 50% { opacity: .2; } }
    @keyframes twinkle-c { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .t-a { animation: twinkle-a 2.6s ease-in-out infinite; }
    .t-b { animation: twinkle-b 3.4s ease-in-out infinite; }
    .t-c { animation: twinkle-c 4.2s ease-in-out infinite; }
    @keyframes comet {
      0%   { transform: translate(-140px, -40px); opacity: 0; }
      6%   { opacity: 1; }
      30%  { opacity: 1; }
      42%  { transform: translate(1000px, 300px); opacity: 0; }
      100% { transform: translate(1000px, 300px); opacity: 0; }
    }
    .comet1 { animation: comet 8s linear infinite; }
    .comet2 { animation: comet 11s linear infinite; animation-delay: 4.5s; }
  </style>

  <rect width="1500" height="260" fill="url(#space-bg)"/>

